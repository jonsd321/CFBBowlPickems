<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090c16">
  <meta name="description" content="Pick the winner of every college football bowl game and track the standings all bowl season.">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Bowl Pickems">
  <!-- Link previews (texts, group chats, social posts) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CFB Bowl Pickems">
  <meta property="og:title" content="CFB Bowl Pickems">
  <meta property="og:description" content="Pick the winner of every college football bowl game and track the standings all bowl season.">
  <meta property="og:url" content="https://jonsd321.github.io/CFBBowlPickems/">
  <meta property="og:image" content="https://jonsd321.github.io/CFBBowlPickems/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>html{background:#090c16}</style>
  <title>CFB Bowl Pickems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <a class="bug" href="#bowls" aria-label="CFB Bowl Pickems home">
      <b><span id="league-name">CFB Bowl Pickems</span></b>
      <span><span id="season-label"></span></span>
    </a>

    <!-- Tabs sit in the header on wide screens and become a bottom tab bar on phones. -->
    <nav class="tabs" aria-label="Sections">
      <a class="tab" href="#bowls" data-view="bowls">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="5.5" transform="rotate(-35 12 12)"/><path d="M9 15l6-6M10.5 11.5l2 2"/></svg><span>Bowls</span>
      </a>
      <a class="tab" href="#leaderboard" data-view="leaderboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Standings</span>
      </a>
      <a class="tab" href="#race" data-view="race">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span>Race</span>
      </a>
      <a class="tab" href="#commish" data-view="commish" id="admin-tab" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Commish</span>
      </a>
      <a class="tab tab-me" href="#me" data-view="me">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Me</span>
      </a>
    </nav>

    <div id="user-area" class="user-area"></div>
  </header>

  <div id="ticker"></div>
  <div id="banners" class="wrap"></div>
  <!-- Picks-left reminder: top of the Bowls page on wide screens, pinned above the tab bar on phones. -->
  <div id="owe"></div>
  <main id="view" class="wrap"></main>
  <footer class="site-foot wrap">Schedules, scores and team logos from ESPN. Bowl logos from Wikipedia.</footer>

  <dialog id="auth-dialog" class="sheet">
    <form id="auth-form" data-mode="join" novalidate>
      <div id="google-area">
        <button type="button" class="google-btn" data-action="google">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Continue with Google
        </button>
        <div class="or"><span>or use a name and password</span></div>
      </div>
      <div class="seg" role="group" aria-label="Join or sign in">
        <button type="button" data-mode="join" class="is-active"><span>Join</span></button>
        <button type="button" data-mode="signin"><span>Sign in</span></button>
      </div>
      <label class="field">
        <span>Name</span>
        <input id="auth-name" name="name" maxlength="20" autocomplete="username" autocapitalize="words" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="auth-password" name="password" type="password" maxlength="64" autocomplete="new-password" required>
      </label>
      <p id="auth-hint" class="fine"></p>
      <p id="auth-error" class="form-error" hidden></p>
      <div class="row end">
        <button type="button" class="btn ghost" data-action="close-dialog">Cancel</button>
        <button type="submit" class="btn primary">Join the pool</button>
      </div>
    </form>
  </dialog>

  <!-- First Google sign-in: choose the name the standings show. -->
  <dialog id="name-dialog" class="sheet">
    <form id="name-form" novalidate>
      <div class="sheet-head"><div><h2>Pick your name</h2><p class="muted">This is how you'll show up in the standings.</p></div></div>
      <label class="field">
        <span>Name</span>
        <input id="name-input" name="name" maxlength="20" autocomplete="nickname" autocapitalize="words" required>
      </label>
      <p id="name-error" class="form-error" hidden></p>
      <div class="row end">
        <button type="button" class="btn ghost" data-action="sign-out"><span>Sign out</span></button>
        <button type="submit" class="btn primary"><span>Save</span></button>
      </div>
    </form>
  </dialog>

  <dialog id="player-dialog" class="sheet wide"></dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/install.js"></script>
</body>
</html>
